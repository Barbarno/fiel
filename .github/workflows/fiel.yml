name: fiel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fidelidad:
    name: motor y ejemplo en python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install .

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Comprobar fidelidad del ejemplo
        run: fiel --root examples/demo check --format github --no-baseline --pair cron-fiel

  rust:
    name: port real en rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel
        run: pip install .

      - name: Compilar el port
        run: cargo build --release
        working-directory: examples/rust-demo/rust-port

      - name: Pruebas del port
        run: cargo test --release
        working-directory: examples/rust-demo/rust-port

      - name: Comprobar equivalencia con el original
        run: fiel --root examples/rust-demo --spec fiel.linux.toml check --format github --no-baseline

  targets:
    name: tres targets nuevos en rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel
        run: pip install .

      - name: Compilar los tres ports
        run: |
          cargo build --release --manifest-path examples/targets/url/rust-port/Cargo.toml
          cargo build --release --manifest-path examples/targets/toml/rust-port/Cargo.toml
          cargo build --release --manifest-path examples/targets/slug/rust-port/Cargo.toml

      - name: Comprobar equivalencia
        run: fiel --spec fiel.linux.toml check --format github --no-baseline

  semver:
    name: dos bibliotecas reales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel y la biblioteca original
        run: pip install . semver

      - name: Compilar el port
        run: cargo build --release
        working-directory: examples/real-semver/rust-port

      - name: Comprobar equivalencia
        run: |
          fiel --root examples/real-semver --spec fiel.linux.toml check \
            --format github --no-baseline --pair semver-real --pair semver-real-fijo

  portes:
    name: seis reescrituras a mano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel
        run: pip install .

      - name: Los seis ports pasan el corpus normal
        run: |
          fiel --root estudio/portes check --format github --no-baseline \
            --pair mano-csv --pair mano-shlex --pair mano-url \
            --pair mano-wrap --pair mano-ip --pair mano-casefold

      - name: Las trampas siguen divergiendo
        run: |
          set +e
          salida=$(fiel --root estudio/portes check --no-baseline \
            --pair mano-csv-trampas --pair mano-shlex-trampas --pair mano-url-trampas \
            --pair mano-wrap-trampas --pair mano-ip-trampas --pair mano-casefold-trampas)
          codigo=$?
          echo "$salida"
          if [ "$codigo" -eq 0 ]; then
            echo "::error::las trampas ya no divergen; el hallazgo del banco se ha perdido"
            exit 1
          fi
          if ! echo "$salida" | grep -qE "Divergencias \((3[5-9]|[4-9][0-9])\)"; then
            echo "::error::se esperaban al menos 35 divergencias en el corpus de trampas"
            exit 1
          fi

  diagnostico:
    name: doctor, coverage, probe y watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel
        run: pip install .

      - name: El entorno esta listo y los dos lados arrancan
        run: fiel --root examples/demo doctor --smoke

      - name: El corpus ejecuta la mayor parte del original
        run: fiel --root examples/demo coverage --pair cron-fiel --min 90

      - name: La cobertura del estudio se imprime, sin umbral
        run: fiel --spec fiel.estudio.toml coverage --format markdown

      - name: Probe dice la verdad en las dos direcciones
        run: |
          set +e
          fiel --root estudio/portes probe --pair mano-url --input "http://host/a#b"
          malo=$?
          fiel --root estudio/portes probe --pair mano-url --input "http://host/a"
          bueno=$?
          echo "no fiel -> $malo (se espera 1); fiel -> $bueno (se espera 0)"
          test "$malo" -eq 1
          test "$bueno" -eq 0

      - name: Watch da una vuelta y termina
        run: fiel --root examples/demo watch --pair cron-fiel --vueltas 1 --interval 0.1 --quiet

  puerta:
    name: el hook de git bloquea un commit roto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar fiel
        run: pip install .

      - name: Un repositorio de pruebas con el ejemplo dentro
        run: |
          mkdir "$RUNNER_TEMP/puerta"
          cp -r examples/demo/. "$RUNNER_TEMP/puerta/"
          cd "$RUNNER_TEMP/puerta"
          git init -q
          git config user.email fiel@example.invalid
          git config user.name fiel
          git add -A
          git commit -qm "base"
          fiel guard --install --pair cron-fiel
          test -f .git/hooks/pre-commit

      - name: Un commit limpio pasa
        run: |
          cd "$RUNNER_TEMP/puerta"
          git commit -q --allow-empty -m "limpio"

      - name: Una linea que rompe el port detiene el commit
        run: |
          cd "$RUNNER_TEMP/puerta"
          printf '\nraise SystemExit(3)\n' >> port.py
          git add -A
          set +e
          git commit -qm "roto" 2>&1 | tee salida.txt
          codigo=${PIPESTATUS[0]}
          set -e
          echo "commit roto -> $codigo (se espera distinto de 0)"
          if [ "$codigo" -eq 0 ]; then
            echo "::error::el commit roto se creo igual"
            exit 1
          fi
          if git log --oneline | grep -q "roto"; then
            echo "::error::el commit roto aparece en el historial"
            exit 1
          fi

      - name: Quitar la puerta deja commitear otra vez
        run: |
          cd "$RUNNER_TEMP/puerta"
          fiel guard --remove
          test ! -f .git/hooks/pre-commit
          git commit -qam "con la puerta quitada"
