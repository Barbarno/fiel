# Target 'slug': un original en Python y su port en Rust.
#
# Compila antes de comprobar:
#   cd rust-port && cargo build --release --target x86_64-pc-windows-gnu

[project]
baseline = "fiel.baseline.json"

[[pair]]
id = "slug"
original = { command = ["python", "original.py"] }
port = { command = ["rust-port/target/x86_64-pc-windows-gnu/release/slug-rs.exe"] }
corpus = "corpus/slug.jsonl"
timeout_ms = 10000
normalize = "text"
errors = "ignore"

[[pair]]
id = "slug-trampas"
original = { command = ["python", "original.py"] }
port = { command = ["rust-port/target/x86_64-pc-windows-gnu/release/slug-rs.exe"] }
corpus = "corpus/traps.jsonl"
timeout_ms = 10000
normalize = "text"
errors = "ignore"
